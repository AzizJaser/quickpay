spring:
  application:
    name: bill-service

  datasource:
    # Bill service owns its OWN database (data ownership) — separate from the wallet's.
    url: jdbc:postgresql://localhost:5433/bill
    username: bill
    password: bill

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only validates. Never 'update' in a money system.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false   # keep transactions inside the service layer

  flyway:
    enabled: true
    locations: classpath:db/migration   # your V1__... migrations go here


  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:quickpay}
    password: ${RABBITMQ_PASS:quickpay}

  task:
    scheduling:
      pool:
        size: 2
server:
  port: 8081   # wallet=8080, gateway-sim=9090, biller-sim=9091, bill-service=8081

logging:
  file:
    name: logs/bill-service.log
  pattern:
    level: "%5p [%X{correlationId:-}]"
  level:
    org.hibernate.SQL: warn
  logback:
    rollingpolicy:
      max-history: 60

# Downstream services the bill service calls over HTTP. Wire the RestClient(s) yourself;
# these are just the base URLs (overridable by env var for docker/CI).
quickpay:
  wallet-base-url: ${WALLET_BASE_URL:http://localhost:8080}
  biller-base-url: ${BILLER_BASE_URL:http://localhost:9091}

bill:
  eod-interval-ms: ${BILL_RECONCILIATION_INTERVAL_MS:10000}
  notification-interval-ms: ${BILL_NOTIFICATION_INTERVAL:2000}
  events-exchange: ${BILL_EVENTS_EXCHANGE:quickpay.events}
  biller-settlement-window-ms: ${BILLER_SETTLEMENT_WINDOW:60000}