# Local Postgres for the QuickPay wallet service.
# Start it with:  docker compose up -d
# Stop it with:   docker compose down   (add -v to also wipe the data volume)
services:
  postgres:
    image: postgres:16
    container_name: quickpay-wallet-db
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "5432:5432"
    volumes:
      - wallet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Separate Postgres for the bill service (its own data, on host port 5433).
  bill-db:
    image: postgres:16
    container_name: quickpay-bill-db
    environment:
      POSTGRES_DB: bill
      POSTGRES_USER: bill
      POSTGRES_PASSWORD: bill
    ports:
      - "5433:5432"
    volumes:
      - bill_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bill -d bill"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  wallet_pgdata:
  bill_pgdata: