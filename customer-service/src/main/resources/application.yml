spring:
  application:
    name: customer-service

  datasource:
    # customer service owns its OWN database (data ownership) — separate from the wallet's.
    url: jdbc:postgresql://localhost:5435/customer
    username: customer
    password: customer

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only validates. Never 'update' in a money system.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration   # your V1__... migrations go here


  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:quickpay}
    password: ${RABBITMQ_PASS:quickpay}
    publisher-returns: true
    publisher-confirm-type: correlated
    template:
      mandatory: true

  task:
    scheduling:
      pool:
        size: 2

server:
  port: 8083   # wallet=8080, gateway-sim=9090, biller-sim=9091, bill-service=8081, customer-service = 8083


logging:
  file:
    name: logs/customer-service.log
  pattern:
    level: "%5p [%X{correlationId:-}]"
  level:
    org.hibernate.SQL: warn
  logback:
    rollingpolicy:
      max-history: 60

customer:
  events-exchange: ${CUSTOMER_EVENTS_EXCHANGE:quickpay.events}
  notification-interval-ms: ${CUSTOMER_NOTIFICATION_INTERVAL:2000}
  session-ttl-minutes: ${CUSTOMER_SESSION_TTL:60}