spring:
  application:
    name: wallet-service

  datasource:
    url: jdbc:postgresql://localhost:5432/wallet
    username: wallet
    password: wallet

  jpa:
    hibernate:
      # 'validate' means Hibernate checks the schema matches your entities but
      # never changes it. Flyway owns the schema, not Hibernate. Do NOT set this
      # to 'update' in a money system — you want migrations to be explicit.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false   # keep transactions inside the service layer, not the view

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Broker connection only. The exchange/queue topology and the publishing code are
  # yours to write — this just tells Spring where RabbitMQ is (docker-compose).
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:quickpay}
    password: ${RABBITMQ_PASS:quickpay}

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug   # see the SQL Hibernate generates while you learn

wallet:
  max-per-cif: ${WALLET_MAX_PER_CIF:5}
  create-max-retries: ${WALLET_CREATE_MAX_RETRIES:5}
  reconciliation-interval-ms: ${WALLET_RECONCILIATION_INTERVAL_MS:60000}
  gateway.webhook-secret: ${WALLET_WEBHOOK_SECRET:"super-secret-key"}
  notification-interval-ms: ${WALLET_NOTIFICATION_INTERVAL_MS:2000}
  events-exchange: ${WALLET_EVENTS_EXCHANGE:quickpay.events}